<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>07-Simple Login</title>
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="log-in">
        <div class="container">
            <div class="background">
                <div id="background-log-in-1"></div>
                <div id="background-log-in-2"></div>
            </div>
            <div class="box-log-in">
                <div class="box-log-in-2">
                <h1>ورود کاربر</h1>
                <input class="input-different" type="text" placeholder="نام کاربری" name="username">
                <input class="input-different" type="password" placeholder="رمز عبور" name="password">
                <div class="box-remember-me">
                    <div>
                        <input class="checkbox" type="checkbox" id="remember-me" name="remember-me" value="remember-me">
                        <label for="remember-me">مرا به خاطر بسپار</label>
                    </div>
                    <a href="#">فراموشی رمز؟</a>
                </div>
                <input type="submit" value="ورود">
            </div>
            </div>
        </div>
    </div>
    
</body>
</html>
