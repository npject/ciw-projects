<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>04-Sliding Card Layout</title>
   <link href="assets/css/style.css" rel="stylesheet">
   <link href="../../assets/css/all.min.css" rel="stylesheet">
</head>

<body>
   <section class="main">

                           <img src="assets/img/Ellipse 1 copy 10.jpg">

                     </div>
                  </div>
                  <div class="white">
                     <p>لورم ایپسوم</p>

                  </div>

               <div class="box">

                     </div>
                     <div class="circle">
                        <div class="circle-inner">

                  </div>
                  <div class="white">
                     <p>لورم ایپسوم</p>
                     <p>متن ساختگی</p>
                     <div class="star">
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                     </div>
                     <div class="button">
                        <button>لورم ایپسوم</button>
                        <button>متن ساختگی</button>
                     </div>
                  </div>
               </div>
               
               <div class="box">
                  <div class="purple">

                        <i class="fa-brands fa-instagram"></i>

                     <p>لورم ایپسوم</p>
                     <p>متن ساختگی</p>
                     <div class="star">

                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-solid fa-star"></i>
                        <i class="fa-regular fa-star"></i>
                     </div>
                     <div class="button">
                        <button>لورم ایپسوم</button>
                        <button>متن ساختگی</button>
                     </div>
                  </div>         
               </div>

               <div class="angle">
                  <i class="fa-solid fa-angle-left"></i>
               </div>
            </div>
            <div class="content-bottom">
               <div class="text">
                  <p>لورم ایپسوم متن ساختگی

</html>
