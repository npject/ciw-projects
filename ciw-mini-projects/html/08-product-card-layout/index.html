<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>08-Product Card Layout</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/all.min.css" rel="stylesheet">
</head>
<body>
    <section class="main">
        <div class="container">
            <div class="main-box">
                <div class="box">
                    <div class="content-box">
                        <div class="title">
                            <h2>Airmax</h2>
                            <div>
                                <a href="#"><i class="fa-solid fa-search"></i></a>
                                <a href="#"><i class="fa-solid fa-user"></i></a>
                                <a href="#"><i class="fa-solid fa-shopping-cart"></i></a>
                            </div>
                        </div>
                        <div class="content-box-2">
                            <h3>Winter Collection</h3>
                            <h1>Men Black Sneakers</h1>
                            <div class="price">
                                <span>$150</span>
                                <span>$200</span>
                            </div>
                            <div class="size">
                                <span>size</span>
                                <span>7</span>
                                <span>8</span>
                                <span>9</span>
                                <span>10</span>
                                <span>11</span>
                            </div>
                            <div class="color">
                                <span>color</span>
                                <div class="circle"></div>
                                <div class="circle"></div>
                                <div class="circle"></div>
                            </div>
                            <div class="buy">
                                <a href="#"><i class="fa-solid fa-shopping-bag"></i> Buy Now</a>
                                <a href="#"><i class="fa-solid fa-shopping-cart"></i> Add To Cart</a>
                            </div>
                        </div>
                    </div>
                    <div class="item-box">
                        <div class="color-item"></div>
                        <img src="assets/img/2.png">
                        <div></div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
</body>
</html>
