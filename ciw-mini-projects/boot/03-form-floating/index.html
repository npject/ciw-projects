<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03-Form Floating</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <form>
                    <div class="row row-form">
                        <div class="col-lg-12 form-floating">
                            <input class="form-control text-end" id="name-lastname" type="text" name="name.." placeholder=" "></input>
                            <label class="form-label h6" for="name-lastname">نام و نام خانوادگی :</label>
                        </div>
                        <div class="col-lg-12 form-floating">
                            <input class="form-control text-end" id="f-name" type="text" name="f-name" placeholder=" "></input>
                            <label class="form-label h6" for="f-name">نام پدر :</label>
                        </div>
                        <div class="col-lg-12 form-floating">
                            <input class="form-control text-end" id="m-name" type="text" name="m-name" placeholder=" "></input>
                            <label class="form-label h6" for="m-name">نام مادر :</label>
                        </div>
                        <div class="col-lg-12 form-floating">
                            <input class="form-control text-end" id="phone-number" type="text" name="phone-number" placeholder=" "></input>
                            <label class="form-label h6" for="phone-number">شماره موبایل :</label>
                        </div>
                        <div class="col-lg-12 form-floating">
                            <input class="form-control text-end" id="email" type="email" name="email.." placeholder="sample@example.com"></input>
                            <label class="form-label h6" for="email">ایمیل :</label>
                        </div>
                        <div class="col-lg-12 input-group">
                            <input class="form-control text-center" type="number" min="1300" max="1403" name="date" placeholder="سال"></input>
                            <select class="form-select text-center">
                                <option selected disabled>ماه</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
                                <option>7</option>
                                <option>8</option>
                                <option>9</option>
                                <option>10</option>
                                <option>11</option>
                                <option>12</option>
                            </select>
                            <select class="form-select text-center">
                                <option selected disabled>روز</option>
                                <option>1</option>
                                <option>2</option>
                                <option>3</option>
                                <option>4</option>
                                <option>5</option>
                                <option>6</option>
                                <option>7</option>
                                <option>8</option>
                                <option>9</option>
                                <option>10</option>
                                <option>11</option>
                                <option>12</option>
                                <option>13</option>
                                <option>14</option>
                                <option>15</option>
                                <option>16</option>
                                <option>17</option>
                                <option>18</option>
                                <option>19</option>
                                <option>20</option>
                                <option>21</option>
                                <option>22</option>
                                <option>23</option>
                                <option>24</option>
                                <option>25</option>
                                <option>26</option>
                                <option>27</option>
                                <option>28</option>
                                <option>29</option>
                                <option>30</option>
                                <option>31</option>
                            </select>
                            <label class="form-label h6 input-group-text mb-0">تاریخ تولد :</label>
                        </div>
                        <div class="col-lg-12 form-floating">
                            <input class="form-control text-end" id="address" type="text" placeholder="street-house-road" name="address"></input>
                            <label class="form-label h6" for="address">آدرس :</label>
                        </div>
                        <div class="col-lg-12">
                            <label class="form-label h6 float-end">عکس :</label>
                            <label class="btn btn-outline-success" for="file-upload">Upload</label>
                            <input  id="file-upload" type="file"></input>
                        </div>
                        <div class="col-lg-12">
                            
                        </div>
                        <div class="col-lg-2 col-md-3 submit">
                            <input class="btn btn-success" type="submit" value="ارسال"></input>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    

    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
