<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>05-Simple Slider</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <section class="container-fluid g-0" id="project-0">
            <div class="col-lg-12">
                <div id="carouselExampleIndicators" class="carousel slide">
                    <div class="carousel-indicators">
                        <img src="assets/img/01.jpg" class="rounded-pill active" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0">
                        <img src="assets/img/02.jpg" class="rounded-pill" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1">
                        <img src="assets/img/03.jpg" class="rounded-pill" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2">
                    </div>

                    <div class="carousel-inner vh-100">
                        <div class="carousel-item active">
                            <img src="assets/img/01.jpg" class="d-block w-100 img-fluid">
                        </div>
                        <div class="carousel-item">
                            <img src="assets/img/02.jpg" class="d-block w-100 img-fluid">
                        </div>
                        <div class="carousel-item">
                            <img src="assets/img/03.jpg" class="d-block w-100 img-fluid">
                        </div>
                    </div>
                    <button type="button" class="carousel-control-prev" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button type="button" class="carousel-control-next" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
    </section>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
</body>
</html>
